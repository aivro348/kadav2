name: Build and Deploy Frontend to Hostinger Branch

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'php-backend/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Prepare Hostinger Deployment Branch
        run: |
          mkdir hostinger_deploy
          cp -r frontend/dist/* hostinger_deploy/
          cp frontend/vercel.json hostinger_deploy/ 2>/dev/null || :
          
          # Copy PHP backend to the deployment artifact
          cp -r php-backend hostinger_deploy/
          
          # Add .htaccess for React routing on Hostinger Apache servers
          cat << 'EOF' > hostinger_deploy/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF
          
          # Add a dummy package.json to bypass Hostinger's strict framework checks
          cat << 'EOF' > hostinger_deploy/package.json
          {
            "name": "hostinger-static-deploy",
            "version": "1.0.0",
            "description": "Dummy package to bypass framework checks",
            "scripts": {
              "build": "echo 'Already built!'"
            }
          }
          EOF

      - name: Deploy to hostinger-production branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./hostinger_deploy
          publish_branch: hostinger-production
          force_orphan: true
          commit_message: "Auto-build frontend for Hostinger deployment"
