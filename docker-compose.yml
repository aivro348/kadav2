version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rws_postgres
    environment:
      POSTGRES_USER: rws_user
      POSTGRES_PASSWORD: rws_password
      POSTGRES_DB: rws_borewell
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
